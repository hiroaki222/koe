name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS only. The crate pulls in Metal through whisper-rs and CoreML through
  # speakrs, so there is no other platform it compiles on, let alone runs.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # whisper-rs builds whisper.cpp from source.
      - run: brew install cmake

      # The runner has ffmpeg only if we put it there, and koe shells out to
      # both binaries rather than linking a decoder.
      - run: brew install ffmpeg
      - run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Everything below runs against the release profile, which is what ships.
      # whisper-rs compiles whisper.cpp through cmake, and cargo keeps a separate
      # build per profile: checking in debug and then building in release
      # compiled it twice and took most of the run.
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release --locked
