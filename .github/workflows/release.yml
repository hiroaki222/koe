name: Release

on:
  push:
    tags: ["v*"]
  # A tag-only workflow cannot be exercised until the moment it matters. A
  # manual run builds, packs and assembles the notes without touching the
  # release page: every step that publishes is guarded on the tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The draft goes up first so the build has somewhere to upload to, and stays
  # a draft until it has. A release page carrying notes but no downloads reads
  # as broken for as long as the build takes.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff reads the whole history to work out what this tag added.
          fetch-depth: 0
          persist-credentials: false

      # A tag that disagrees with Cargo.toml ships a binary reporting the wrong
      # version, and the tap would pin a tarball whose contents contradict the
      # version it advertises.
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Fetch git-cliff
        run: |
          set -euo pipefail
          version=2.13.1
          name="git-cliff-$version-x86_64-unknown-linux-gnu"
          bash .github/scripts/fetch.sh \
            "https://github.com/orhun/git-cliff/releases/download/v$version/$name.tar.gz" \
            cliff.tar.gz
          tar -xzf cliff.tar.gz
          find . -type f -name git-cliff -exec mv {} ./git-cliff \;
          chmod +x ./git-cliff
          ./git-cliff --version

      # GitHub renders the assets below the body, so the setup notice goes last:
      # nearest the download links, where someone about to install will read it.
      - name: Assemble the release body
        run: |
          set -euo pipefail
          ./git-cliff --latest --strip all > release-body.md

          # An empty changelog means the tag matched no commits. That is a
          # mistake worth stopping for rather than publishing around, and it
          # has to be checked before the notice is appended or the notice
          # alone would pass.
          test -s release-body.md

          printf '\n' >> release-body.md
          cat .github/release-notice.md >> release-body.md
          cat release-body.md

      - name: Open a draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) pre=true ;;
            *)                      pre=false ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$GITHUB_REF_NAME" \
            -f "name=$GITHUB_REF_NAME" \
            -F "body=@release-body.md" \
            -F draft=true \
            -F "prerelease=$pre" \
            --jq .id

  build:
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: brew install cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Apple silicon only. An Intel Mac cannot run the Metal and CoreML paths
      # this tool depends on, so a build for it would be slower than the tool
      # claims to be.
      - run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Pack it
        id: pack
        run: |
          set -euo pipefail
          name="koe-$GITHUB_REF_NAME-aarch64-apple-darwin"
          tar -czf "$name.tar.gz" \
            -C target/aarch64-apple-darwin/release koe \
            -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE README.md
          shasum -a 256 "$name.tar.gz" | tee "$name.tar.gz.sha256"
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.asset }}" \
            "${{ steps.pack.outputs.asset }}.sha256" --clobber

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Everything has uploaded by now, so there is something to show.
      - name: Take it out of draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
